<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>定时任务工作台</title>
<style>
  :root{--bg:#0d1117;--panel:#151b24;--panel2:#1b222d;--line:#253040;--text:#e6edf3;--dim:#8b98a9;--dim2:#6b7788;
        --blue:#5b9dff;--green:#3fb950;--amber:#d29922;--red:#f85149;--purple:#bc8cff}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:13.5px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC",Arial,sans-serif}
  code{font-family:ui-monospace,Menlo,monospace;font-size:12px;background:#0b1017;border:1px solid var(--line);border-radius:4px;padding:1px 5px;color:#a8c7fa}
  header{position:sticky;top:0;z-index:9;background:rgba(13,17,23,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .hrow{display:flex;align-items:center;gap:14px;padding:11px 20px;flex-wrap:wrap}
  h1{font-size:15px;margin:0;font-weight:650}
  .sub{color:var(--dim2);font-size:11.5px}
  .grow{flex:1}
  input,textarea,select,button{font:inherit;color:var(--text)}
  input,textarea,select{background:#0b1017;border:1px solid var(--line);border-radius:7px;padding:6px 9px;outline:none;width:100%}
  input:focus,textarea:focus,select:focus{border-color:var(--blue)}
  button{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:5px 11px;cursor:pointer;font-size:12.5px}
  button:hover{border-color:#35455c;background:#222b38}
  button.primary{background:#1c2b40;border-color:var(--blue);color:#cfe1ff}
  button.danger{background:#2a0f0d;border-color:#5d1f1b;color:#ff9d96}
  main{padding:0 20px 40px}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:9px;margin:14px 0}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
  .stat .k{font-size:20px;font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums}
  .stat .l{color:var(--dim2);font-size:10.5px}
  .stat.green .k{color:var(--green)}.stat.blue .k{color:var(--blue)}.stat.amber .k{color:var(--amber)}
  .stat.red .k{color:var(--red)}.stat.purple .k{color:var(--purple)}
  .filters{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
  .filters button{border-radius:20px}
  .filters button.on{background:#1c2b40;border-color:var(--blue);color:#cfe1ff}
  .board{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:11px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 15px;display:flex;flex-direction:column;gap:9px}
  .card:hover{border-color:#31415a}
  .card .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .card .nm{font-weight:650;font-size:13.5px}
  .card .desc{color:var(--dim);font-size:12.5px;margin:0;min-height:2.6em}
  .meta{display:grid;grid-template-columns:1fr 1fr;gap:5px 12px;font-size:12px}
  .meta .cell{display:flex;gap:6px;align-items:baseline;min-width:0}
  .meta .lbl{color:var(--dim2);font-size:11px;flex:none}
  .meta b{font-weight:600;color:#c3cddb;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card .acts{display:flex;gap:7px;align-items:center;border-top:1px solid #1c2431;padding-top:9px;margin-top:auto}
  .dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--dim2)}
  .dot.ok{background:var(--green)}.dot.err{background:var(--red)}.dot.run{background:var(--blue)}
  .dot.off{background:#3a4453}
  .tag{font-size:10.5px;font-weight:600;padding:1px 7px;border-radius:20px;border:1px solid;white-space:nowrap}
  .t-ok{color:var(--green);border-color:#1f5b31;background:#0f2a18}
  .t-warn{color:var(--amber);border-color:#5c470f;background:#241c07}
  .t-err{color:var(--red);border-color:#5d1f1b;background:#2a0f0d}
  .t-dim{color:var(--dim);border-color:#333c4a;background:#171d26}
  .t-run{color:var(--blue);border-color:#1d3d69;background:#0e1d31}
  /* 编辑视图 */
  .edithead{display:flex;align-items:center;gap:12px;margin:16px 0 12px;flex-wrap:wrap}
  .edithead h2{font-size:16px;margin:0;font-weight:650}
  .ecard{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:14px 16px;margin-bottom:11px;max-width:900px}
  .ecard h3{margin:0 0 10px;font-size:13px;font-weight:650}
  .row{display:grid;grid-template-columns:92px 1fr;gap:10px;align-items:start;margin-bottom:9px}
  .row > label{color:var(--dim);font-size:12px;padding-top:7px}
  .hint{color:var(--dim2);font-size:11px;margin-top:3px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .cal{display:flex;flex-direction:column;gap:6px}
  .calrow,.calhead{display:grid;grid-template-columns:repeat(5,1fr) 34px;gap:6px;align-items:center}
  .calrow input{text-align:center}
  .calhead{color:var(--dim2);font-size:10.5px;text-align:center}
  .actions{display:flex;gap:8px;flex-wrap:wrap;position:sticky;bottom:0;background:linear-gradient(180deg,transparent,var(--bg) 40%);padding:12px 0 6px;max-width:900px}
  .dstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));gap:8px}
  .dstat{background:#0b1017;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
  .dstat .k{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
  .dstat .l{color:var(--dim2);font-size:10.5px}
  .spark{display:flex;align-items:flex-end;gap:2px;height:44px;margin-top:8px}
  .spark i{flex:1;background:linear-gradient(180deg,#5b9dff,#2b5c9e);border-radius:2px;min-height:2px}
  .spark i.bad{background:linear-gradient(180deg,#f85149,#7d211c)}
  .toast{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:50}
  .toast div{background:#1c2b40;border:1px solid var(--blue);border-radius:8px;padding:9px 14px;font-size:12.5px;max-width:440px;white-space:pre-wrap}
  .toast div.err{background:#2a0f0d;border-color:var(--red)}
  .empty{color:var(--dim2);text-align:center;padding:50px 20px}
  .hidden{display:none!important}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <h1 id="title">定时任务看板</h1>
    <span class="sub" id="meta">加载中…</span>
    <span class="grow"></span>
    <input id="q" placeholder="搜索任务…" style="width:190px">
    <button id="addBtn">+ 新建</button>
    <button id="refreshBtn">刷新</button>
  </div>
</header>

<main>
  <!-- ============ 看板 ============ -->
  <div id="board-view">
    <div class="stats" id="stats"></div>
    <div class="filters" id="filters">
      <button data-f="" class="on">全部</button>
      <button data-f="err">有异常</button>
      <button data-f="run">运行中</button>
      <button data-f="off">已停用</button>
      <button data-f="drift">未迁 label</button>
    </div>
    <div class="board" id="board"></div>
    <div class="empty hidden" id="empty">没有匹配的任务</div>
  </div>

  <!-- ============ 编辑 ============ -->
  <div id="edit-view" class="hidden"></div>
</main>

<div class="toast" id="toast"></div>

<script>
const TOKEN = "__TOKEN__";
const api = async (path, options = {}) => {
  const res = await fetch(path, {
    ...options,
    headers: { "content-type": "application/json", "x-workbench-token": TOKEN, ...(options.headers || {}) },
  });
  const data = await res.json().catch(() => ({ ok: false, error: "响应不是 JSON" }));
  if (!res.ok || !data.ok) throw new Error(data.error || ("HTTP " + res.status));
  return data.data ?? data;
};
const toast = (text, bad) => {
  const box = document.getElementById("toast");
  const el = document.createElement("div");
  if (bad) el.className = "err";
  el.textContent = text;
  box.appendChild(el);
  setTimeout(() => el.remove(), bad ? 9000 : 3500);
};
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmtMs = (ms) => (ms == null ? "—" : ms < 1000 ? `${ms} ms` : ms < 60000 ? `${(ms / 1000).toFixed(1)} s` : `${Math.floor(ms / 60000)} 分 ${Math.round((ms % 60000) / 1000)} 秒`);
const pad = (n) => String(n).padStart(2, "0");
function fmtNext(iso) {
  if (!iso) return "—";
  const d = new Date(iso), now = new Date();
  const sameDay = d.toDateString() === now.toDateString();
  const t = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  if (sameDay) return `今天 ${t}`;
  const tomorrow = new Date(now.getTime() + 86400000);
  if (d.toDateString() === tomorrow.toDateString()) return `明天 ${t}`;
  return `${pad(d.getMonth() + 1)}/${pad(d.getDate())} ${t}`;
}

let STATE = { tasks: [] };
let filter = "";
let view = "board";
let selected = null, draft = null, dirty = false;

const statusOf = (t) => {
  if (t.enabled === false) return ["off", "已停用", "t-dim"];
  if (t.pid) return ["run", "运行中", "t-run"];
  if (t.lastExit !== null && t.lastExit !== 0) return ["err", `退出 ${t.lastExit}`, "t-err"];
  if (t.installed) return ["ok", "已加载", "t-ok"];
  return ["", "未安装", "t-dim"];
};

function renderStats() {
  const t = STATE.tasks;
  const running = t.filter((x) => x.pid).length;
  // 与卡片上的状态点保持一致：已停用/运行中的不算"有异常"
  const failing = t.filter((x) => statusOf(x)[0] === "err").length;
  const daily = t.reduce((n, x) => n + (x.perDay || 0), 0);
  const drift = t.filter((x) => !x.installed || x.legacyPresent).length;
  const stats = [
    [t.length, "任务总数", "blue"],
    [running, "运行中", running ? "blue" : "green"],
    [failing, "有异常", failing ? "red" : "green"],
    [Math.round(daily), "每天触发次数", "amber"],
    [drift, "清单与系统不一致", drift ? "amber" : "green"],
  ];
  document.getElementById("stats").innerHTML = stats.map(([k, l, c]) =>
    `<div class="stat ${c}"><div class="k">${k}</div><div class="l">${l}</div></div>`).join("");
}

function renderBoard() {
  const q = document.getElementById("q").value.trim().toLowerCase();
  const box = document.getElementById("board");
  box.innerHTML = "";
  let shown = 0;
  for (const t of STATE.tasks) {
    const [cls, label, tag] = statusOf(t);
    if (filter === "err" && cls !== "err") continue;
    if (filter === "run" && cls !== "run") continue;
    if (filter === "off" && t.enabled !== false) continue;
    if (filter === "drift" && !(t.legacyPresent || !t.installed)) continue;
    const hay = `${t.name} ${t.description || ""} ${t.command.join(" ")}`.toLowerCase();
    if (q && !hay.includes(q)) continue;
    shown++;

    const dur = t.duration
      ? `<b title="平均 ${fmtMs(t.duration.avg)} · P95 ${fmtMs(t.duration.p95)} · 最长 ${fmtMs(t.duration.max)}">中位 ${fmtMs(t.duration.p50)}</b>`
      : '<b style="color:var(--dim2)">未记录</b>';
    const freq = t.frequency?.label ?? "—";

    const card = document.createElement("article");
    card.className = "card";
    card.innerHTML = `
      <div class="top">
        <span class="dot ${cls}"></span>
        <span class="nm">${esc(t.name)}</span>
        <span class="tag ${tag}">${label}</span>
        ${t.legacyPresent ? '<span class="tag t-warn">旧 label</span>' : ""}
      </div>
      <p class="desc">${esc(t.description || "（没有说明）")}</p>
      <div class="meta">
        <div class="cell"><span class="lbl">时间</span><b title="${esc(t.schedule.text)}">${esc(t.schedule.text)}</b></div>
        <div class="cell"><span class="lbl">频次</span><b>${freq}</b></div>
        <div class="cell"><span class="lbl">耗时</span>${dur}</div>
        <div class="cell"><span class="lbl">下次</span><b>${fmtNext(t.nextRun)}</b></div>
      </div>
      <div class="acts">
        <button class="primary" data-edit="${esc(t.name)}">编辑</button>
        <button data-run="${esc(t.name)}">运行一次</button>
        <span class="grow"></span>
        <span class="sub">${t.duration ? `跑了 ${t.duration.runs} 次` : ""}</span>
      </div>`;
    box.appendChild(card);
  }
  document.getElementById("empty").classList.toggle("hidden", shown > 0);
  box.classList.toggle("hidden", shown === 0);
}

/* ---------------- 编辑视图 ---------------- */

const calRow = (c = {}) => {
  const v = (k) => (c[k] === undefined ? "" : c[k]);
  return `<div class="calrow">
    <input data-k="month" type="number" min="1" max="12" value="${v("month")}" placeholder="每">
    <input data-k="day" type="number" min="1" max="31" value="${v("day")}" placeholder="每">
    <input data-k="weekday" type="number" min="0" max="6" value="${v("weekday")}" placeholder="每">
    <input data-k="hour" type="number" min="0" max="23" value="${v("hour")}" placeholder="每">
    <input data-k="minute" type="number" min="0" max="59" value="${v("minute")}" placeholder="0">
    <button class="rm" title="删除">−</button>
  </div>`;
};

function enterEdit(name) {
  const task = STATE.tasks.find((t) => t.name === name);
  if (!task) return;
  selected = name;
  draft = JSON.parse(JSON.stringify(task));
  dirty = false;
  view = "edit";
  renderEdit();
}

function exitEdit() {
  if (dirty && !confirm("改动还没保存，确定离开？")) return;
  view = "board"; selected = null; draft = null; dirty = false;
  document.getElementById("edit-view").classList.add("hidden");
  document.getElementById("board-view").classList.remove("hidden");
  document.getElementById("title").textContent = "定时任务看板";
  document.getElementById("q").parentElement.classList.remove("hidden");
  renderBoard();
}

function renderEdit() {
  const t = draft;
  const live = STATE.tasks.find((x) => x.name === t.name) || {};
  const d = live.duration;
  const kind = t.keepAlive ? "daemon" : t.interval ? "interval" : (t.calendar && t.calendar.length) ? "calendar" : "manual";

  document.getElementById("board-view").classList.add("hidden");
  const box = document.getElementById("edit-view");
  box.classList.remove("hidden");
  document.getElementById("title").textContent = "编辑任务";
  document.getElementById("q").parentElement.classList.add("hidden");

  box.innerHTML = `
  <div class="edithead">
    <button id="backBtn">← 返回看板</button>
    <h2>${esc(t.name)}</h2>
    <span class="tag t-dim">${esc(live.schedule?.text || "")}</span>
    ${dirty ? '<span class="sub">有未保存改动</span>' : ""}
  </div>

  <div class="ecard">
    <h3>它是什么</h3>
    <div class="row"><label>说明</label><div><input id="f-desc" value="${esc(t.description || "")}" placeholder="一句话说清它取什么数、干什么用"></div></div>
    <div class="row"><label>label</label><div><code>${esc(live.label || t.label || "")}</code>
      <div class="hint">上次退出码 ${live.lastExit ?? "—"} · ${live.installed ? "已装入 launchd" : "还没装入 launchd"}${live.legacyPresent ? ` · 旧 label ${esc(live.legacyLabel)} 仍在` : ""}</div></div></div>
  </div>

  <div class="ecard">
    <h3>什么时候跑</h3>
    <div class="row"><label>触发方式</label><div>
      <select id="f-kind">
        <option value="calendar"${kind === "calendar" ? " selected" : ""}>按日历（每天 / 每周 / 每月）</option>
        <option value="interval"${kind === "interval" ? " selected" : ""}>按间隔（每 N 秒）</option>
        <option value="daemon"${kind === "daemon" ? " selected" : ""}>常驻进程</option>
        <option value="manual"${kind === "manual" ? " selected" : ""}>仅手动</option>
      </select></div></div>
    <div id="f-cal" style="${kind === "calendar" ? "" : "display:none"}">
      <div class="row"><label>时刻</label><div class="cal">
        <div class="calhead"><span>月</span><span>日</span><span>周</span><span>时</span><span>分</span><span></span></div>
        <div id="calrows">${(t.calendar && t.calendar.length ? t.calendar : [{}]).map(calRow).join("")}</div>
        <div><button id="addCal">+ 再加一个时刻</button></div>
        <div class="hint">留空 = 每个。只填「分」= 每小时那一分钟。周：0=周日。</div>
      </div></div></div>
    </div>
    <div id="f-int" style="${kind === "interval" ? "" : "display:none"}">
      <div class="row"><label>间隔</label><div><input id="f-interval" type="number" min="10" value="${t.interval || 300}">
        <div class="hint">单位秒，最小 10 秒。</div></div></div>
    </div>
  </div>

  <div class="ecard">
    <h3>跑什么</h3>
    <div class="row"><label>命令</label><div>
      <textarea id="f-cmd" rows="4" spellcheck="false">${esc((t.command || []).join("\n"))}</textarea>
      <div class="hint">一行一个参数，不走 shell（管道、&& 不生效）。要 shell 就写 <code>/bin/bash</code> / <code>-lc</code> / 脚本路径。</div>
    </div></div>
    <div class="grid2">
      <div class="row"><label>工作目录</label><div><input id="f-cwd" value="${esc(t.cwd || "")}" placeholder="~/projects/xxx"></div></div>
      <div class="row"><label>日志</label><div><input id="f-log" value="${esc(t.log || "")}" placeholder="~/Library/Logs/xxx.log"></div></div>
    </div>
    <div class="row"><label>环境变量</label><div><textarea id="f-env" rows="2" spellcheck="false" placeholder="PATH=/usr/bin:/bin">${esc(Object.entries(t.env || {}).map(([k, v]) => `${k}=${v}`).join("\n"))}</textarea></div></div>
    <div class="grid2">
      <div class="row"><label>启用</label><div><select id="f-enabled">
        <option value="1"${t.enabled !== false ? " selected" : ""}>启用</option>
        <option value="0"${t.enabled === false ? " selected" : ""}>停用</option></select></div></div>
      <div class="row"><label>计时</label><div><select id="f-track">
        <option value="1"${t.track && !t.keepAlive ? " selected" : ""}>记录耗时</option>
        <option value="0"${!t.track || t.keepAlive ? " selected" : ""}>不记录</option></select>
        <div class="hint">常驻进程没有「跑完」，不参与计时。</div></div></div>
    </div>
  </div>

  <div class="ecard">
    <h3>耗时</h3>
    ${d ? `<div class="dstats">
      <div class="dstat"><div class="k">${fmtMs(d.p50)}</div><div class="l">中位数</div></div>
      <div class="dstat"><div class="k">${fmtMs(d.avg)}</div><div class="l">平均</div></div>
      <div class="dstat"><div class="k">${fmtMs(d.p95)}</div><div class="l">P95</div></div>
      <div class="dstat"><div class="k">${fmtMs(d.max)}</div><div class="l">最长</div></div>
      <div class="dstat"><div class="k">${d.runs}</div><div class="l">次数</div></div>
    </div>
    <div class="spark">${d.recent.map((r) => {
      const max = Math.max(...d.recent.map((x) => x.ms), 1);
      return `<i class="${r.exit ? "bad" : ""}" style="height:${Math.max(2, Math.round((r.ms / max) * 100))}%" title="${r.at} · ${fmtMs(r.ms)}${r.exit ? " · 退出 " + r.exit : ""}"></i>`;
    }).join("")}</div>
    <div class="hint">最近 ${d.recent.length} 次（柱高=耗时，红=失败）</div>`
    : '<div class="hint">还没有耗时记录。点「运行一次」立刻就有；装成定时任务后每次运行都会累积。</div>'}
  </div>

  <div class="actions">
    <button class="primary" id="saveBtn">保存</button>
    <button id="applyBtn">安装到 launchd</button>
    <button id="unapplyBtn">卸载</button>
    <button id="runBtn">运行一次</button>
    <button class="danger" id="delBtn">删除</button>
  </div>`;

  const markDirty = () => { if (!dirty) { dirty = true; document.querySelector(".edithead .sub")?.remove(); document.querySelector(".edithead").insertAdjacentHTML("beforeend", '<span class="sub">有未保存改动</span>'); } };
  box.querySelectorAll("input,textarea,select").forEach((el) => el.addEventListener("input", markDirty));
  document.getElementById("backBtn").onclick = exitEdit;
  document.getElementById("f-kind").onchange = (e) => {
    document.getElementById("f-cal").style.display = e.target.value === "calendar" ? "" : "none";
    document.getElementById("f-int").style.display = e.target.value === "interval" ? "" : "none";
    markDirty();
  };
  document.getElementById("addCal").onclick = () => {
    document.getElementById("calrows").insertAdjacentHTML("beforeend", calRow({}));
    bindCal(); markDirty();
  };
  bindCal();
  document.getElementById("saveBtn").onclick = save;
  document.getElementById("applyBtn").onclick = () => apply("install");
  document.getElementById("unapplyBtn").onclick = () => apply("uninstall");
  document.getElementById("runBtn").onclick = runNow;
  document.getElementById("delBtn").onclick = remove;

  function bindCal() {
    document.querySelectorAll("#calrows .rm").forEach((btn) => {
      btn.onclick = () => {
        if (document.querySelectorAll("#calrows .calrow").length <= 1) return;
        btn.parentElement.remove(); markDirty();
      };
    });
  }
}

function collect() {
  const t = JSON.parse(JSON.stringify(draft));
  t.description = document.getElementById("f-desc").value.trim();
  t.command = document.getElementById("f-cmd").value.split("\n").map((s) => s.trim()).filter(Boolean);
  t.cwd = document.getElementById("f-cwd").value.trim();
  t.log = document.getElementById("f-log").value.trim();
  t.enabled = document.getElementById("f-enabled").value === "1";
  t.track = document.getElementById("f-track").value === "1";
  const env = {};
  for (const line of document.getElementById("f-env").value.split("\n")) {
    const i = line.indexOf("=");
    if (i > 0) env[line.slice(0, i).trim()] = line.slice(i + 1).trim();
  }
  t.env = env;
  const kind = document.getElementById("f-kind").value;
  delete t.calendar; delete t.interval; delete t.keepAlive;
  if (kind === "daemon") t.keepAlive = true;
  else if (kind === "interval") t.interval = Number(document.getElementById("f-interval").value);
  else if (kind === "calendar") {
    t.calendar = [...document.querySelectorAll("#calrows .calrow")].map((row) => {
      const out = {};
      row.querySelectorAll("input").forEach((input) => {
        if (input.value !== "") out[input.dataset.k] = Number(input.value);
      });
      return out;
    }).filter((c) => Object.keys(c).length);
    if (!t.calendar.length) t.calendar = [{ minute: 0 }];
  }
  return t;
}

async function save() {
  try {
    draft = collect();
    await api("/api/task", { method: "POST", body: JSON.stringify(draft) });
    dirty = false;
    toast(`已保存 ${draft.name}（触发时间要「安装到 launchd」才生效）`);
    await load();
    renderEdit();
  } catch (e) { toast("保存失败：" + e.message, true); }
}

async function apply(action) {
  try {
    const out = await api("/api/apply", { method: "POST", body: JSON.stringify({ action, names: [selected] }) });
    toast(out.output || "完成");
    await load();
  } catch (e) { toast("操作失败：" + e.message, true); }
}

async function runNow() {
  try {
    await api("/api/run", { method: "POST", body: JSON.stringify({ name: selected }) });
    toast(`已启动 ${selected}，几秒后回来看耗时`);
    setTimeout(load, 3000);
  } catch (e) { toast("启动失败：" + e.message, true); }
}

async function remove() {
  if (!confirm(`从清单删除 ${selected}？不会动 launchd 里已装的。`)) return;
  try {
    await api(`/api/task?name=${encodeURIComponent(selected)}`, { method: "DELETE" });
    dirty = false;
    toast("已删除");
    exitEdit();
    await load();
  } catch (e) { toast("删除失败：" + e.message, true); }
}

function newTask() {
  document.getElementById("board-view").classList.add("hidden");
  const box = document.getElementById("edit-view");
  box.classList.remove("hidden");
  document.getElementById("title").textContent = "新建任务";
  document.getElementById("q").parentElement.classList.add("hidden");
  box.innerHTML = `<div class="edithead"><button id="backBtn">← 返回看板</button><h2>新建任务</h2></div>
    <div class="ecard"><h3>先起个名字</h3>
      <div class="row"><label>名字</label><div><input id="f-name" placeholder="例如 crypto-report">
        <div class="hint">小写字母 + 连字符，会成为 launchd label 的一部分</div></div></div>
      <div class="actions"><button class="primary" id="createBtn">创建并编辑</button></div></div>`;
  document.getElementById("backBtn").onclick = () => {
    document.getElementById("edit-view").classList.add("hidden");
    document.getElementById("board-view").classList.remove("hidden");
    document.getElementById("title").textContent = "定时任务看板";
    document.getElementById("q").parentElement.classList.remove("hidden");
  };
  document.getElementById("createBtn").onclick = () => {
    const name = document.getElementById("f-name").value.trim();
    if (!/^[a-z][a-z0-9]*(-[a-z0-9]+)*$/.test(name)) return toast("名字不合法：小写字母开头，用 - 连接", true);
    if (STATE.tasks.some((t) => t.name === name)) return toast("已经有同名任务", true);
    draft = { name, description: "", command: ["/bin/echo", "hello"], calendar: [{ hour: 9, minute: 0 }],
      enabled: true, track: true, log: `~/Library/Logs/shopdesk/${name}.log` };
    selected = name;
    dirty = true;
    renderEdit();
  };
}

async function load() {
  try {
    const data = await api("/api/state");
    STATE = data;
    document.getElementById("meta").textContent =
      `${data.tasks.length} 个任务 · ${data.historyCount} 条耗时记录 · 更新于 ${new Date(data.generatedAt).toLocaleTimeString("zh-CN", { hour12: false })}`;
    renderStats();
    if (view === "board") renderBoard();
  } catch (e) { toast("刷新失败：" + e.message, true); }
}

document.getElementById("q").addEventListener("input", renderBoard);
document.getElementById("filters").addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-f]");
  if (!btn) return;
  [...document.querySelectorAll("#filters button")].forEach((b) => b.classList.toggle("on", b === btn));
  filter = btn.dataset.f;
  renderBoard();
});
document.getElementById("board").addEventListener("click", (e) => {
  const edit = e.target.closest("[data-edit]");
  if (edit) return enterEdit(edit.dataset.edit);
  const run = e.target.closest("[data-run]");
  if (run) { selected = run.dataset.run; return runNow(); }
});
document.getElementById("addBtn").onclick = newTask;
document.getElementById("refreshBtn").onclick = load;
document.addEventListener("keydown", (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key === "s") { e.preventDefault(); if (view === "edit" && draft) save(); }
  if (e.key === "Escape" && view === "edit") exitEdit();
  if (e.key === "/" && document.activeElement.tagName !== "INPUT" && document.activeElement.tagName !== "TEXTAREA") {
    e.preventDefault(); document.getElementById("q").focus();
  }
});
window.addEventListener("beforeunload", (e) => { if (dirty) { e.preventDefault(); e.returnValue = ""; } });

load();
setInterval(() => { if (!dirty) load(); }, 5000);
</script>
</body>
</html>
