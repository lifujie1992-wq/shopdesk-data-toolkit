<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>订单 · 本地快照</title>
<style>
*{box-sizing:border-box}body{margin:0;font:14px system-ui,sans-serif;background:#f5f7fa;color:#223047}header{padding:20px 26px;background:#163450;color:white}h1{font-size:23px;margin:0 0 8px}header small{opacity:.75}main{padding:20px}input,button,select{font:inherit;padding:8px 12px;border:1px solid #ced7e0;border-radius:5px;background:white}button{cursor:pointer;color:#0768ad}nav{display:flex;gap:10px;align-items:center;margin-bottom:15px}#query{width:360px;max-width:60vw}.table-wrap{overflow:auto;max-height:72vh;background:white;border:1px solid #dce3ea}table{border-collapse:collapse;min-width:100%;font-size:13px}th,td{padding:10px 12px;border:1px solid #e3e8ed;white-space:pre-wrap;min-width:100px;max-width:420px;overflow-wrap:anywhere;vertical-align:top}th{background:#edf2f6;position:sticky;top:0;text-align:left;z-index:1}td:first-child,th:first-child{position:sticky;left:0;background:#f3f8fc;z-index:2}td:first-child{min-width:145px}tbody tr:hover td{background:#eef7ff}dialog{width:min(1500px,96vw);height:92vh;border:0;border-radius:8px;padding:0;color:inherit}dialog::backdrop{background:#142d4780}.dialog-head{position:sticky;top:0;background:white;z-index:5;padding:16px 22px;display:flex;justify-content:space-between;border-bottom:1px solid #ddd}.body{padding:20px}section{background:white;border:1px solid #dce3ea;margin:0 0 18px}h2{font-size:16px;margin:0;padding:12px;background:#eff4f8}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1px;background:#e7edf2}.pair{background:white;padding:12px}.label{color:#6b7d90;font-size:12px;margin-bottom:6px}.value{overflow-wrap:anywhere;white-space:pre-wrap}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:12px ui-monospace,monospace;padding:12px;max-height:480px;overflow:auto}details{margin:12px 0}summary{cursor:pointer;color:#0768ad;padding:8px}.empty{padding:20px;color:#718198}#count{color:#657a8a}#columns{max-height:230px;overflow:auto;background:white;padding:12px}#columns label{display:inline-block;padding:6px;min-width:180px}
</style>
<header><h1>订单</h1><small id="meta"></small></header>
<main><nav><input id="query" placeholder="搜索内部订单号、店铺、商品、状态"><button id="toggle">自定义列</button><span id="count"></span></nav><div id="columns" hidden></div><div class="table-wrap"><table id="orders"></table></div></main>
<dialog id="detail"><div class="dialog-head"><strong id="title"></strong><button id="close">关闭</button></div><div class="body" id="detail-body"></div></dialog>
<script>
const snapshot=/*SNAPSHOT*/null;
const $=id=>document.getElementById(id), labels={o_id:'内部订单号',so_id:'线上订单号',order_date:'下单时间',pay_date:'付款时间',send_date:'发货时间',status:'状态',status_text:'状态',shop_name:'店铺',shop_site:'平台',amount:'订单金额',pay_amount:'应付金额',paid_amount:'已付金额',freight:'运费',free_amount:'优惠金额',buyer_message:'买家留言',remark:'卖家备注',node:'便签',receiver_name:'收货人',receiver_state:'省',receiver_city:'市',receiver_district:'区县',receiver_address:'地址',receiver_mobile:'手机',logistics_company:'快递公司',l_id:'快递单号',sku_id:'商品编码',i_id:'款式编码',name:'商品名称',qty:'数量',price:'成交单价',oi_id:'商品明细编号',pay_id:'支付单号',created:'创建时间',creator_name:'操作人',refund_status:'退款状态',cost_price:'成本单价',revenue:'收入明细',receiver_town:'街道',all_item_qty:'商品总数量',left_item_qty:'剩余数量',refund_item_qty:'取消数量'};
for(const c of snapshot.columns)if(c.name&&!c.name.includes('{@@'))labels[c.id]=c.name;
function el(tag,text){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;return e}
function text(v){return v===null?'空':typeof v==='object'?JSON.stringify(v,null,2):String(v??'')}
function table(rows,keys){const wrap=el('div');wrap.className='table-wrap';const t=el('table'),head=el('tr');for(const k of keys)head.append(el('th',labels[k]||k));const thead=el('thead');thead.append(head);t.append(thead);const body=el('tbody');for(const row of rows){const tr=el('tr');for(const k of keys)tr.append(el('td',text(row[k])));body.append(tr)}t.append(body);wrap.append(t);return wrap}
function section(title,value){const s=el('section');s.append(el('h2',title));if(value===null||value===undefined||Array.isArray(value)&&!value.length){const e=el('div','无数据');e.className='empty';s.append(e)}else if(Array.isArray(value)){const objects=value.every(v=>v&&typeof v==='object'&&!Array.isArray(v));s.append(objects?table(value,[...new Set(value.flatMap(Object.keys))]):el('pre',text(value)))}else if(typeof value==='object'){const grid=el('div');grid.className='grid';for(const [k,v]of Object.entries(value)){const p=el('div');p.className='pair';const l=el('div',labels[k]||k);l.className='label';l.title=k;const val=el('div',text(v));val.className='value';p.append(l,val);grid.append(p)}s.append(grid)}else s.append(el('pre',text(value)));return s}
function show(id){const d=snapshot.details.find(x=>String(x.o_id)===String(id));$('title').textContent='销售订单详情 · '+id;const body=$('detail-body');body.replaceChildren();if(!d){body.append(el('p','此订单尚未采集详情。请使用 CLI detail 命令采集。'));$('detail').showModal();return}Object.assign(labels,d.field_labels);const used=new Set(['items','pays','actions']);for(const [title,keys]of [['交易信息',['o_id','so_id','type','status','status_text','shop_name','shop_site','order_date','pay_date','confirm_date','send_date','amount','pay_amount','paid_amount','freight','free_amount','buyer_paid_amount','seller_income_amount','logistics_company','l_id','wms_co_name','plan_delivery_date']],['备注信息',['labels','seller_flag','buyer_message','remark','node','raw_remark']],['收货地址信息',Object.keys(d.order).filter(k=>/receiver|^full_address|^Mask|^Encrypted/.test(k))],['发票信息',Object.keys(d.order).filter(k=>/invoice|tax_no/.test(k))]]){const values={};for(const k of keys)if(Object.hasOwn(d.order,k)){values[k]=d.order[k];used.add(k)}body.append(section(title,values))}body.append(section('订单支付情况',d.order.pays),section('订单商品',d.order.items),section('售后信息',d.aftersales),section('订单操作进程及日志',d.order.actions),section('收入与优惠明细',d.revenue),section('其他订单字段',Object.fromEntries(Object.entries(d.order).filter(([k])=>!used.has(k)))),section('扩展字段',{extensions:d.extensions,extension_model:d.extension_model}));const raw=el('details');raw.append(el('summary','查看全部原始字段'),el('pre',JSON.stringify(d,null,2)));body.append(raw);$('detail').showModal()}
let keys=['o_id','status','shop_name','its','so_id','order_date','pay_date','paid_amount','labels','logistics_company','plan_delivery_date'];
const available=[...new Set(snapshot.rows.flatMap(Object.keys))];keys=keys.filter(k=>available.includes(k));
function draw(){const q=$('query').value.toLowerCase(), rows=snapshot.rows.filter(r=>[r.o_id,r.shop_name,r.skus,r.its,r.status,r.so_id].some(v=>String(v??'').toLowerCase().includes(q)));const t=$('orders');t.replaceChildren();const tr=el('tr');for(const k of keys)tr.append(el('th',labels[k]||k));const h=el('thead');h.append(tr);t.append(h);const b=el('tbody');for(const row of rows){const r=el('tr');for(const k of keys){const td=el('td');if(k==='o_id'){td.append(el('div',text(row[k])));const btn=el('button','详细');btn.onclick=()=>show(row.o_id);td.append(btn)}else td.textContent=text(row[k]);r.append(td)}b.append(r)}t.append(b);$('count').textContent=rows.length+' 条 / 已采集详情 '+snapshot.details.length+' 条'}
for(const k of available){const label=el('label'),checkbox=el('input');checkbox.type='checkbox';checkbox.checked=keys.includes(k);checkbox.disabled=k==='o_id';checkbox.onchange=()=>{keys=checkbox.checked?[...keys,k]:keys.filter(x=>x!==k);draw()};label.append(checkbox,document.createTextNode(labels[k]||k));$('columns').append(label)}
$('meta').textContent='常用 → 订单 · 本地数据快照 · '+snapshot.captured_at;
$('query').oninput=draw;$('close').onclick=()=>$('detail').close();$('toggle').onclick=()=>$('columns').hidden=!$('columns').hidden;draw();
</script></html>
