# shopdesk 日志轮转（newsyslog）
#
# 安装：sudo cp ops/newsyslog.shopdesk.conf /etc/newsyslog.d/shopdesk.conf
# 生效：newsyslog 由系统定时拉起，不需要重启；想立刻验证跑一次 sudo newsyslog -v
#
# 字段：文件 属主:属组 权限 保留份数 体积阈值(KB) 轮转时刻 标志 目标PID
#   N = 不向进程发信号（launchd 的 stdout 被重定向，重命名后由 launchd 自己续写新文件）

